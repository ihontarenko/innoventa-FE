<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #1E78A4; }
    @media (prefers-color-scheme: dark) { .bg { fill: #2996C8; } }
  </style>
  <rect width="32" height="32" rx="7" class="bg"/>
  <!-- Stem -->
  <line x1="16" y1="5" x2="16" y2="16"
        stroke="white" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Arrow V -->
  <polyline points="4,12 16,16 28,12"
            fill="none" stroke="white" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="4,17 16,21 28,17"
            fill="none" stroke="white" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <polyline points="4,22 16,26 28,22"
            fill="none" stroke="white" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
